source = $HOME/.config/hypr/cyberpunk.conf

# Matches the "pixel-night-city" SDDM theme.
# Tuned for 1920x1080 (theme scale factor s = 1080/768 = 1.40625).

$font = Pixelify Sans Bold

$signTeal  = rgb(1AC5B0)
$signPink  = rgb(E455AE)
$textWhite = rgb(E8FBFD)

general {
  hide_cursor = false
}

animations {
  enabled = true
  bezier = outSine, 0.61, 1, 0.88, 1
  animation = fadeIn, 1, 9, outSine
  animation = fadeOut, 1, 9, outSine
  animation = inputFieldDots, 1, 2, outSine
}

# BACKGROUND
# Still frame from the theme's bg.mp4 with its 30% black overlay baked in.
background {
  monitor =
  path = $HOME/.config/hypr/nightcity.png
  blur_passes = 0
  color = $base
}

# CLOCK - HOURS
label {
  monitor =
  text = cmd[update:1000] date +"<span letter_spacing='-7168'>%I</span>"
  color = rgb(FFFFFF)
  font_size = 141
  font_family = $font
  position = 84, -84
  halign = left
  valign = top
}

# CLOCK - NEON NEEDLE
shape {
  monitor =
  size = 6, 113
  color = $signPink
  rounding = 0
  border_size = 0
  position = 275, -113
  halign = left
  valign = top
}

# CLOCK - MINUTES
label {
  monitor =
  text = cmd[update:1000] date +"<span letter_spacing='-7168'>%M</span>"
  color = $signTeal
  font_size = 141
  font_family = $font
  position = 309, -84
  halign = left
  valign = top
}

# CLOCK - AM/PM
label {
  monitor =
  text = cmd[update:1000] echo "<span letter_spacing='2048'>$(date +%p | tr '[:lower:]' '[:upper:]')</span>"
  color = $textWhite
  font_size = 40
  font_family = $font
  position = 520, -200
  halign = left
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] echo "<span letter_spacing='11264'>$(date +'%A, %B %-d' | tr '[:lower:]' '[:upper:]')</span>"
  color = rgba(FFFFFFCC)
  font_size = 17
  font_family = $font
  position = 84, -268
  halign = left
  valign = top
}

# USER NAME
label {
  monitor =
  text = cmd[update:0] echo "<span letter_spacing='8448'>$(getent passwd "$(id -un)" | cut -d: -f5 | cut -d, -f1 | tr '[:lower:]' '[:upper:]')</span>"
  color = $textWhite
  font_size = 31
  font_family = $font
  position = 0, 277
  halign = center
  valign = bottom
}

# INPUT FIELD UNDERLINE
shape {
  monitor =
  size = 506, 3
  color = $signPink
  rounding = 0
  border_size = 0
  position = 0, 176
  halign = center
  valign = bottom
}

# INPUT FIELD
input-field {
  monitor =
  size = 506, 56
  outline_thickness = 0
  rounding = 0
  outer_color = rgba(00000000)
  inner_color = rgba(00000000)
  font_color = $signPink
  font_family = $font
  dots_text_format = ─
  dots_size = 0.35
  dots_spacing = 0.3
  dots_center = true
  fade_on_empty = false
  placeholder_text = <span foreground="##1AC5B0" alpha="35%" letter_spacing="5632">CONNECTING...</span>
  hide_input = false
  check_color = $signTeal
  fail_color = rgb(FB3048)
  fail_text = <span letter_spacing="4096">PERMISSION DENIED</span>
  capslock_color = rgb(FDF500)
  position = 0, 179
  halign = center
  valign = bottom
}
